# Set working directory (use a new directory when testing v0.2)
workdir: "/home/MinaRyten/Emil/zMISC/results_v0.2"

# Prefix of all output files
sample_name: "test"

# Reference genome as uncompressed FASTA
# Relative paths are resolved against the pipeline directory
genome: "/home/MinaRyten/Emil/references/GRCh38.primary_assembly.genome.fa"

# Input FASTQ file or directory (searched recursively)
# Keep the input directory separate from the working directory
fastq: "/home/MinaRyten/Emil/projects/SCA4/data/27376/"

# Aligner to use (minimap2 or ngmlr; default: minimap2)
aligner: "minimap2"

# Minimap2 preset (default: map-ont)
minimap2_preset: "map-ont"

# Options passed to minimap2 (optional)
# These retain the original mapping settings; -Y is supplied by the workflow
# Review/remove -k 17 if changing the preset
minimap2_opts: "--eqx -k 17 -K 5g -y"

# Options passed to ngmlr (optional)
ngmlr_opts: ""

# Options passed to Sniffles
sniffles_opts: "--minsvlen 50"

# Optional tandem-repeat region annotations (.bed) for Sniffles
# Use an empty string to disable; do not add --tandem-repeats to sniffles_opts
tandem_repeat_region: "/home/MinaRyten/Emil/Snakemakes/long-read_SV_calling/data/human_GRCh38_no_alt_analysis_set.trf.bed"

# Options passed to Straglr
# https://github.com/BirolLab/straglr
straglr_opts: ""

# Maximum threads per rule (optional; default: 30)
# --cores sets the overall Snakemake core budget
threads: 100

# Memory per samtools sort thread (optional; default: 1G)
sort_mem: "1G"
